name: Student Placement Tracker CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: |
          cd backend
          python -c "import main; main.init_db()"
          python seed_problems.py
          pytest test_leaderboard_and_invitations.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend & Frontend Docker Images
        run: |
          docker build -t placement-tracker-backend ./backend
          docker build -t placement-tracker-frontend ./frontend
          docker images
