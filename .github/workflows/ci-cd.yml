name: Student Placement Tracker CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: |
          cd backend
          python -c "import main, seed_problems; main.init_db(); seed_problems.seed_all()"
          pytest test_leaderboard_and_invitations.py -v
